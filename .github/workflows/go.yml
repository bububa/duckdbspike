name: Go

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}
      package: src/github.com/${{ github.repository }}
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/${{ env.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ env.GOPATH }}/${{ env.package }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.27.0"
          cache-dependency-path: |
            ${{ env.GOPATH }}/${{ env.package }}/go.mod
            ${{ env.GOPATH }}/${{ env.package }}/go.sum

      - name: Dependencies
        run: go mod download

      - name: Build & Vet
        run: |
          CGO_ENABLED=0 go build -v ./...
          CGO_ENABLED=0 go vet ./...

      - name: Test
        run: CGO_ENABLED=0 go test -v -count=1 ./...

  native-acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: libduckdb-linux-amd64.zip
            lib: libduckdb.so
            sha256: 3f4962cdd266eab2b479a5b5a4a6d063d279b2954ae814ed00385d553b747633
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: libduckdb-linux-arm64.zip
            lib: libduckdb.so
            sha256: 23686593dba4ec22c6e581bb1c843b3964e84c4bc4d0063d8b4daddd2e20e30a
          - os: macos-latest
            platform: darwin/arm64
            artifact: libduckdb-osx-universal.zip
            lib: libduckdb.dylib
            sha256: 75a519cb914ae36ca22cff0995a8a2e8c9a46990b8c0a479514f741a0d93f344
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ">=1.27.0"
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Download DuckDB v1.5.6 native library
        run: |
          mkdir -m 0700 -p "${RUNNER_TEMP}/duckdb"
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v1.5.6/${{ matrix.artifact }}" -o "${RUNNER_TEMP}/duckdb.zip"
          unzip -q "${RUNNER_TEMP}/duckdb.zip" -d "${RUNNER_TEMP}/duckdb"
          chmod 0700 "${RUNNER_TEMP}/duckdb"
          chmod 0700 "${RUNNER_TEMP}/duckdb/${{ matrix.lib }}"

      - name: Build & Vet
        run: |
          CGO_ENABLED=0 go build -v ./...
          CGO_ENABLED=0 go vet ./...

      - name: Real-native acceptance (CGO_ENABLED=0)
        env:
          DUCKDB_HEADER_DIR: ${{ runner.temp }}/duckdb
          DUCKDB_LIB_PATH: ${{ runner.temp }}/duckdb/${{ matrix.lib }}
          DUCKDB_LIB_SHA256: ${{ matrix.sha256 }}
        run: CGO_ENABLED=0 go test -v -count=1 ./...

      - name: Real-native acceptance (-race)
        env:
          DUCKDB_HEADER_DIR: ${{ runner.temp }}/duckdb
          DUCKDB_LIB_PATH: ${{ runner.temp }}/duckdb/${{ matrix.lib }}
          DUCKDB_LIB_SHA256: ${{ matrix.sha256 }}
        run: go test -race -v -count=1 ./...
